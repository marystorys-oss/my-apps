<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏃 인터벌 러닝</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --warmup-color:   #FFA500;
            --run-color:      #FF4444;
            --walk-color:     #44BB44;
            --cooldown-color: #4488FF;
            --bg:     #0F0F0F;
            --card:   #1A1A1A;
            --card2:  #222222;
            --text:   #FFFFFF;
            --muted:  #888888;
            --border: #2E2E2E;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding: 0 0 48px;
        }

        /* ── 헤더 ── */
        .app-header {
            background: #1E1E1E;
            border-bottom: 3px solid var(--run-color);
            padding: 18px 16px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--run-color);
            box-shadow: 0 0 8px var(--run-color);
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .content { padding: 0 16px; }

        /* ── 카드 ── */
        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 14px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-header .card-title { margin-bottom: 0; }

        /* ── 접기/펼치기 ── */
        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
        }

        .collapsible-header .card-title { margin-bottom: 0; }

        .collapse-arrow {
            font-size: 0.85rem;
            color: var(--muted);
            transition: transform 0.25s;
        }

        .collapse-arrow.open { transform: rotate(180deg); }

        .collapsible-body {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .collapsible-body.open {
            max-height: 2000px;
            margin-top: 14px;
        }

        /* ── 타이머 ── */
        .timer-card {
            text-align: center;
            padding: 28px 16px 24px;
        }

        .phase-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 18px;
            transition: all 0.3s;
        }

        .badge-idle     { background: rgba(136,136,136,0.2); color: var(--muted); }
        .badge-warmup   { background: rgba(255,165,0,0.2);   color: var(--warmup-color); }
        .badge-run      { background: rgba(255,68,68,0.2);   color: var(--run-color); }
        .badge-walk     { background: rgba(68,187,68,0.2);   color: var(--walk-color); }
        .badge-cooldown { background: rgba(68,136,255,0.2);  color: var(--cooldown-color); }

        .timer-display {
            font-size: 4.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            transition: color 0.3s;
        }

        /* 속도 표시 (타이머 안) */
        .speed-display {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            transition: color 0.3s;
            letter-spacing: 0.02em;
        }

        .set-progress {
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%; height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            width: 0%;
            transition: width 1s linear, background-color 0.3s;
        }

        /* ── 컨트롤 ── */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-main {
            flex: 2;
            padding: 17px;
            border: none;
            border-radius: 14px;
            background: var(--run-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-main:active { opacity: 0.75; }

        .btn-sub {
            flex: 1;
            padding: 17px;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: transparent;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sub:active { background: var(--border); }

        /* ── 시간+속도 조절 공통 ── */
        .dur-row {
            display: flex;
            gap: 12px;
        }

        .dur-item {
            flex: 1;
            text-align: center;
        }

        .dur-label {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .dur-ctrl {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dur-btn {
            width: 34px; height: 34px;
            border: none;
            border-radius: 50%;
            background: var(--border);
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .dur-btn:active { background: #444; }

        .dur-val {
            font-size: 1rem;
            font-weight: 700;
            min-width: 42px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* ── 웜업/쿨다운 카드 ── */
        .wc-block {
            background: var(--card2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .wc-block:last-child { margin-bottom: 0; }

        .wc-label {
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .wc-row {
            display: flex;
            gap: 10px;
        }

        /* ── 세트 카드 ── */
        .set-card {
            background: var(--card2);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .set-card:last-child { margin-bottom: 0; }

        .set-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .set-card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
        }

        .set-delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.15s;
        }

        .set-delete-btn:active { opacity: 1; }

        .set-phase-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .set-phase-row:last-child { margin-bottom: 0; }

        .set-phase-label {
            font-size: 0.8rem;
            color: var(--muted);
            width: 52px;
            flex-shrink: 0;
            padding-top: 8px;
        }

        .set-phase-controls {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .set-phase-ctrl {
            flex: 1;
            text-align: center;
        }

        .set-phase-sublabel {
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .add-set-btn {
            width: 100%;
            padding: 11px;
            border: 2px dashed var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .add-set-btn:active {
            border-color: var(--run-color);
            color: var(--text);
        }

        /* ── 기록 ── */
        .history-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .history-item:last-child { border-bottom: none; }

        .history-date {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .history-detail { font-size: 0.9rem; }

        .history-empty {
            text-align: center;
            color: var(--muted);
            padding: 24px 0;
            font-size: 0.9rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.78rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 헤더 -->
<div class="app-header">
    <div class="header-dot"></div>
    <h1>🏃 인터벌 러닝</h1>
</div>

<div class="content">

<!-- 타이머 -->
<div class="card timer-card">
    <div class="phase-badge badge-idle" id="phase-badge">대기 중</div>
    <div class="timer-display" id="timer-display">00:00</div>
    <div class="speed-display" id="speed-display" style="color:var(--muted)">– km/h</div>
    <div class="set-progress" id="set-progress">–</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<!-- 컨트롤 -->
<div class="controls">
    <button class="btn-main" id="main-btn" onclick="toggleTimer()">▶ 시작</button>
    <button class="btn-sub"               onclick="resetTimer()">■ 초기화</button>
</div>

<!-- 웜업 / 쿨다운 -->
<div class="card">
    <div class="collapsible-header" onclick="toggleCollapse('wc')">
        <div class="card-title">웜업 / 쿨다운 &nbsp;(0:00 설정 시 건너뜀)</div>
        <span class="collapse-arrow" id="arrow-wc">▼</span>
    </div>
    <div class="collapsible-body" id="body-wc">

    <div class="wc-block">
        <div class="wc-label" style="color:var(--warmup-color)">🟡 웜업</div>
        <div class="wc-row">
            <div class="dur-item">
                <div class="dur-label">시간</div>
                <div class="dur-ctrl">
                    <button class="dur-btn" onclick="adjWC('warmup','time',-30)">−</button>
                    <div class="dur-val" id="warmup-time">01:00</div>
                    <button class="dur-btn" onclick="adjWC('warmup','time', 30)">+</button>
                </div>
            </div>
            <div class="dur-item">
                <div class="dur-label">속도 (km/h)</div>
                <div class="dur-ctrl">
                    <button class="dur-btn" onclick="adjWC('warmup','speed',-0.5)">−</button>
                    <div class="dur-val" id="warmup-speed">6.0</div>
                    <button class="dur-btn" onclick="adjWC('warmup','speed', 0.5)">+</button>
                </div>
            </div>
        </div>
    </div>

    <div class="wc-block">
        <div class="wc-label" style="color:var(--cooldown-color)">🔵 쿨다운</div>
        <div class="wc-row">
            <div class="dur-item">
                <div class="dur-label">시간</div>
                <div class="dur-ctrl">
                    <button class="dur-btn" onclick="adjWC('cooldown','time',-30)">−</button>
                    <div class="dur-val" id="cooldown-time">01:00</div>
                    <button class="dur-btn" onclick="adjWC('cooldown','time', 30)">+</button>
                </div>
            </div>
            <div class="dur-item">
                <div class="dur-label">속도 (km/h)</div>
                <div class="dur-ctrl">
                    <button class="dur-btn" onclick="adjWC('cooldown','speed',-0.5)">−</button>
                    <div class="dur-val" id="cooldown-speed">5.0</div>
                    <button class="dur-btn" onclick="adjWC('cooldown','speed', 0.5)">+</button>
                </div>
            </div>
        </div>
    </div>

    </div><!-- /collapsible-body wc -->
</div>

<!-- 세트 구성 -->
<div class="card">
    <div class="collapsible-header" onclick="toggleCollapse('sets')">
        <div class="card-title">세트 구성</div>
        <span class="collapse-arrow" id="arrow-sets">▼</span>
    </div>
    <div class="collapsible-body" id="body-sets">
        <div id="sets-container"></div>
        <button class="add-set-btn" onclick="addSet()">+ 세트 추가</button>
    </div>
</div>

<!-- 운동 기록 -->
<div class="card">
    <div class="section-header">
        <div class="card-title">운동 기록</div>
        <button class="clear-btn" onclick="clearHistory()">전체 삭제</button>
    </div>
    <div id="history-container"></div>
</div>

</div><!-- /content -->

<script>
// ── 앱 상태 ──────────────────────────────────────────────
const app = {
    warmup:   { time: 60,  speed: 6.0 },
    cooldown: { time: 60,  speed: 5.0 },
    sets: Array(10).fill(null).map(() => ({
        run:  { time: 120, speed: 8.0 },
        walk: { time: 60,  speed: 6.0 },
    })),
    timerInterval: null,
    running:       false,
    phase:         'idle',   // idle | warmup | run | walk | cooldown | done
    currentSet:    0,
    timeLeft:      0,
    phaseDuration: 0,
    currentSpeed:  0,
};

// ── 접기/펼치기 ──────────────────────────────────────────
function toggleCollapse(id) {
    const body  = document.getElementById(`body-${id}`);
    const arrow = document.getElementById(`arrow-${id}`);
    const isOpen = body.classList.toggle('open');
    arrow.classList.toggle('open', isOpen);
}

// ── 초기화 ───────────────────────────────────────────────
function init() {
    renderSets();
    renderHistory();
    refreshTimerUI();
}

// ── 웜업/쿨다운 조절 ─────────────────────────────────────
function adjWC(phase, field, delta) {
    if (app.running) return;
    if (field === 'time') {
        app[phase].time = Math.max(0, app[phase].time + delta);
        document.getElementById(`${phase}-time`).textContent = fmt(app[phase].time);
    } else {
        app[phase].speed = Math.max(0.5, Math.round((app[phase].speed + delta) * 10) / 10);
        document.getElementById(`${phase}-speed`).textContent = app[phase].speed.toFixed(1);
    }
}

// ── 세트 렌더링 ───────────────────────────────────────────
function renderSets() {
    const c = document.getElementById('sets-container');
    c.innerHTML = app.sets.map((s, i) => `
        <div class="set-card">
            <div class="set-card-header">
                <span class="set-card-title">세트 ${i + 1}</span>
                <button class="set-delete-btn" onclick="deleteSet(${i})" ${app.sets.length <= 1 ? 'disabled' : ''}>🗑️</button>
            </div>

            <div class="set-phase-row">
                <div class="set-phase-label" style="color:var(--run-color)">🔴 달리기</div>
                <div class="set-phase-controls">
                    <div class="set-phase-ctrl">
                        <div class="set-phase-sublabel">시간</div>
                        <div class="dur-ctrl">
                            <button class="dur-btn" onclick="adjSet(${i},'run','time',-30)">−</button>
                            <div class="dur-val" id="s${i}-run-time">${fmt(s.run.time)}</div>
                            <button class="dur-btn" onclick="adjSet(${i},'run','time', 30)">+</button>
                        </div>
                    </div>
                    <div class="set-phase-ctrl">
                        <div class="set-phase-sublabel">속도 (km/h)</div>
                        <div class="dur-ctrl">
                            <button class="dur-btn" onclick="adjSet(${i},'run','speed',-0.5)">−</button>
                            <div class="dur-val" id="s${i}-run-speed">${s.run.speed.toFixed(1)}</div>
                            <button class="dur-btn" onclick="adjSet(${i},'run','speed', 0.5)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="set-phase-row">
                <div class="set-phase-label" style="color:var(--walk-color)">🟢 걷기</div>
                <div class="set-phase-controls">
                    <div class="set-phase-ctrl">
                        <div class="set-phase-sublabel">시간</div>
                        <div class="dur-ctrl">
                            <button class="dur-btn" onclick="adjSet(${i},'walk','time',-30)">−</button>
                            <div class="dur-val" id="s${i}-walk-time">${fmt(s.walk.time)}</div>
                            <button class="dur-btn" onclick="adjSet(${i},'walk','time', 30)">+</button>
                        </div>
                    </div>
                    <div class="set-phase-ctrl">
                        <div class="set-phase-sublabel">속도 (km/h)</div>
                        <div class="dur-ctrl">
                            <button class="dur-btn" onclick="adjSet(${i},'walk','speed',-0.5)">−</button>
                            <div class="dur-val" id="s${i}-walk-speed">${s.walk.speed.toFixed(1)}</div>
                            <button class="dur-btn" onclick="adjSet(${i},'walk','speed', 0.5)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function adjSet(i, phase, field, delta) {
    if (app.running) return;
    if (field === 'time') {
        app.sets[i][phase].time = Math.max(30, app.sets[i][phase].time + delta);
        document.getElementById(`s${i}-${phase}-time`).textContent = fmt(app.sets[i][phase].time);
    } else {
        app.sets[i][phase].speed = Math.max(0.5, Math.round((app.sets[i][phase].speed + delta) * 10) / 10);
        document.getElementById(`s${i}-${phase}-speed`).textContent = app.sets[i][phase].speed.toFixed(1);
    }
}

function addSet() {
    if (app.running) return;
    const last = app.sets[app.sets.length - 1];
    app.sets.push({
        run:  { ...last.run },
        walk: { ...last.walk }
    });
    renderSets();
}

function deleteSet(i) {
    if (app.running || app.sets.length <= 1) return;
    app.sets.splice(i, 1);
    renderSets();
}

// ── 타이머 ───────────────────────────────────────────────
function toggleTimer() {
    app.running ? pause() : resume();
}

function resume() {
    if (app.phase === 'idle' || app.phase === 'done') {
        app.currentSet = 0;
        if (app.warmup.time > 0) enterPhase('warmup');
        else enterPhase('run');
    }
    app.running = true;
    document.getElementById('main-btn').textContent = '⏸ 일시정지';
    app.timerInterval = setInterval(tick, 1000);
}

function pause() {
    app.running = false;
    clearInterval(app.timerInterval);
    document.getElementById('main-btn').textContent = '▶ 계속';
}

function resetTimer() {
    app.running = false;
    clearInterval(app.timerInterval);
    app.phase        = 'idle';
    app.currentSet   = 0;
    app.timeLeft     = 0;
    app.phaseDuration= 0;
    app.currentSpeed = 0;
    document.getElementById('main-btn').textContent = '▶ 시작';
    refreshTimerUI();
}

function tick() {
    app.timeLeft--;
    if (app.timeLeft === 3) speak('셋');
    if (app.timeLeft === 2) speak('둘');
    if (app.timeLeft === 1) speak('하나');
    if (app.timeLeft <= 0) nextPhase();
    else refreshTimerUI();
}

function enterPhase(phase) {
    app.phase = phase;

    const phaseData = {
        warmup:   { time: app.warmup.time,                        speed: app.warmup.speed },
        run:      { time: app.sets[app.currentSet].run.time,      speed: app.sets[app.currentSet].run.speed },
        walk:     { time: app.sets[app.currentSet].walk.time,     speed: app.sets[app.currentSet].walk.speed },
        cooldown: { time: app.cooldown.time,                      speed: app.cooldown.speed },
    };

    const d = phaseData[phase];
    app.timeLeft      = d.time;
    app.phaseDuration = d.time;
    app.currentSpeed  = d.speed;

    const msg = {
        warmup:   `웜업 시작. 속도 ${d.speed} 킬로미터.`,
        run:      `${app.currentSet + 1}세트, 달리기! 속도 ${d.speed} 킬로미터.`,
        walk:     `걷기. 속도 ${d.speed} 킬로미터.`,
        cooldown: `쿨다운 시작. 속도 ${d.speed} 킬로미터.`,
    };
    speak(msg[phase] || '');
    refreshTimerUI();
}

function nextPhase() {
    if (app.phase === 'warmup') {
        enterPhase('run');
    } else if (app.phase === 'run') {
        enterPhase('walk');
    } else if (app.phase === 'walk') {
        app.currentSet++;
        if (app.currentSet < app.sets.length) {
            enterPhase('run');
        } else if (app.cooldown.time > 0) {
            enterPhase('cooldown');
        } else {
            finish();
        }
    } else if (app.phase === 'cooldown') {
        finish();
    }
}

function finish() {
    clearInterval(app.timerInterval);
    app.running      = false;
    app.phase        = 'done';
    app.timeLeft     = 0;
    app.currentSpeed = 0;
    document.getElementById('main-btn').textContent = '▶ 다시 시작';
    refreshTimerUI();
    saveHistory();
    speak('운동 완료! 수고하셨습니다!');
}

// ── UI 갱신 ──────────────────────────────────────────────
const PHASE_CFG = {
    idle:     { label: '대기 중',      cls: 'badge-idle',     color: 'var(--muted)' },
    warmup:   { label: '웜업 중 🟡',   cls: 'badge-warmup',   color: 'var(--warmup-color)' },
    run:      { label: '달리기 중 🔴', cls: 'badge-run',      color: 'var(--run-color)' },
    walk:     { label: '걷기 중 🟢',   cls: 'badge-walk',     color: 'var(--walk-color)' },
    cooldown: { label: '쿨다운 중 🔵', cls: 'badge-cooldown', color: 'var(--cooldown-color)' },
    done:     { label: '완료! 🎉',     cls: 'badge-idle',     color: 'var(--muted)' },
};

function refreshTimerUI() {
    const cfg = PHASE_CFG[app.phase] || PHASE_CFG.idle;

    const badge = document.getElementById('phase-badge');
    badge.textContent = cfg.label;
    badge.className   = `phase-badge ${cfg.cls}`;

    const timerEl = document.getElementById('timer-display');
    timerEl.textContent = fmt(app.timeLeft);
    timerEl.style.color = cfg.color;

    const speedEl = document.getElementById('speed-display');
    speedEl.style.color = cfg.color;
    speedEl.textContent = app.phase === 'idle' || app.phase === 'done'
        ? '– km/h'
        : `${app.currentSpeed.toFixed(1)} km/h`;

    const prog = document.getElementById('set-progress');
    if (app.phase === 'run' || app.phase === 'walk') {
        prog.textContent = `${app.currentSet + 1}세트 / ${app.sets.length}세트`;
    } else if (app.phase === 'idle') {
        prog.textContent = `총 ${app.sets.length}세트`;
    } else if (app.phase === 'done') {
        prog.textContent = `${app.sets.length}세트 완료! 💪`;
    } else {
        prog.textContent = app.phase === 'warmup' ? '웜업' : '쿨다운';
    }

    const pct = app.phaseDuration > 0
        ? ((app.phaseDuration - app.timeLeft) / app.phaseDuration) * 100 : 0;
    const fill = document.getElementById('progress-fill');
    fill.style.width           = `${pct}%`;
    fill.style.backgroundColor = cfg.color;
}

// ── 음성 안내 ─────────────────────────────────────────────
function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang  = 'ko-KR';
    u.rate  = 1.05;
    window.speechSynthesis.speak(u);
}

// ── 운동 기록 ─────────────────────────────────────────────
function saveHistory() {
    const records = JSON.parse(localStorage.getItem('interval-history') || '[]');
    const totalSec = app.sets.reduce((s, set) => s + set.run.time + set.walk.time, 0)
        + app.warmup.time + app.cooldown.time;

    const maxRunSpeed  = Math.max(...app.sets.map(s => s.run.speed));
    const maxWalkSpeed = Math.max(...app.sets.map(s => s.walk.speed));

    records.unshift({
        date:  new Date().toLocaleString('ko-KR', {
                   month: 'numeric', day: 'numeric',
                   hour: '2-digit', minute: '2-digit'
               }),
        sets:  app.sets.length,
        total: fmt(totalSec),
        runSpd: maxRunSpeed.toFixed(1),
        walkSpd: maxWalkSpeed.toFixed(1),
    });

    if (records.length > 30) records.pop();
    localStorage.setItem('interval-history', JSON.stringify(records));
    renderHistory();
}

function renderHistory() {
    const records = JSON.parse(localStorage.getItem('interval-history') || '[]');
    const c = document.getElementById('history-container');
    if (!records.length) {
        c.innerHTML = '<div class="history-empty">아직 운동 기록이 없어요 💪</div>';
        return;
    }
    c.innerHTML = records.map(r => `
        <div class="history-item">
            <div class="history-date">${r.date}</div>
            <div class="history-detail">
                ${r.sets}세트 &nbsp;·&nbsp; 총 ${r.total}
                ${r.runSpd ? `&nbsp;·&nbsp; 최대 ${r.runSpd}km/h` : ''}
            </div>
        </div>
    `).join('');
}

function clearHistory() {
    if (!confirm('운동 기록을 모두 삭제할까요?')) return;
    localStorage.removeItem('interval-history');
    renderHistory();
}

// ── 유틸 ─────────────────────────────────────────────────
function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

init();
</script>
